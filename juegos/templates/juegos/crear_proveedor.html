{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-gray-800 p-6 rounded shadow">
    <h2 class="text-2xl font-bold text-white mb-4">Nuevo Proveedor</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-300 mb-2">Nombre*</label>
            <input type="text" name="nombre" required class="w-full px-3 py-2 bg-gray-700 text-white rounded">
        </div>
        <div class="mb-4">
            <label class="block text-gray-300 mb-2">Contacto</label>
            <input type="text" name="contacto" class="w-full px-3 py-2 bg-gray-700 text-white rounded">
        </div>
        <div class="mb-4">
            <label class="block text-gray-300 mb-2">Teléfono</label>
            <input type="text" name="telefono" class="w-full px-3 py-2 bg-gray-700 text-white rounded">
        </div>
        <div class="mb-4">
            <label class="block text-gray-300 mb-2">Email</label>
            <input type="email" name="email" class="w-full px-3 py-2 bg-gray-700 text-white rounded">
        </div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white">Guardar</button>
        <a href="{% url 'registrar_compra' %}" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-white ml-2">Cancelar</a>
    </form>
</div>
{% endblock %}
