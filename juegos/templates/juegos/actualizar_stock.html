{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-gray-800 p-6 rounded shadow mt-8">
    <h2 class="text-xl font-bold text-white mb-4">Actualizar stock de {{ producto.nombre }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-4">
            <label class="block text-gray-300 mb-2">Nuevo stock</label>
            <input type="number" name="stock" value="{{ producto.stock }}" class="w-full px-3 py-2 bg-gray-700 text-white rounded">
        </div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white">Guardar</button>
        <a href="{% url 'listar_productos' %}" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-white ml-2">Cancelar</a>
    </form>
</div>
{% endblock %}
