{% extends 'base.html' %}
{% block content %}
<div class="max-w-2xl mx-auto bg-gray-800 p-6 rounded shadow mt-8">
    <h2 class="text-2xl font-bold text-white mb-4">{{ titulo }}</h2>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="mt-6">
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded text-white">Guardar</button>
            <a href="{% url 'listar_productos' %}" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-white ml-2">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
