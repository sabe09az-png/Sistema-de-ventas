{% extends 'base.html' %}
{% block content %}
<div class="max-w-md mx-auto bg-gray-800 p-6 rounded shadow mt-8 text-center">
    <h2 class="text-xl font-bold text-white mb-4">¿Eliminar producto?</h2>
    <p class="text-gray-300 mb-6">¿Estás seguro de eliminar "{{ producto.nombre }}" permanentemente?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 hover:bg-red-700 px-4 py-2 rounded text-white">Sí, eliminar</button>
        <a href="{% url 'listar_productos' %}" class="bg-gray-600 hover:bg-gray-700 px-4 py-2 rounded text-white ml-2">Cancelar</a>
    </form>
</div>
{% endblock %}
