{% extends 'base.html' %}

{% block title %}Iniciar Sesión - Sistema Gestión{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
    <div class="bg-gray-800 rounded-2xl p-8 shadow-2xl">
        <h2 class="text-2xl font-bold text-white text-center mb-2">Iniciar Sesión</h2>
        <p class="text-gray-400 text-center mb-6">Accede al sistema de gestión</p>
        
        <form method="post">
            {% csrf_token %}
            
            <div class="space-y-4">
                <div>
                    <label class="block text-gray-300 mb-2 text-sm font-medium">Usuario</label>
                    <input type="text" name="username" 
                           class="w-full bg-gray-700 border border-gray-600 text-white px-4 py-3 rounded-lg focus:outline-none focus:border-blue-500"
                           placeholder="Nombre de usuario" required>
                </div>
                
                <div>
                    <label class="block text-gray-300 mb-2 text-sm font-medium">Contraseña</label>
                    <input type="password" name="password" 
                           class="w-full bg-gray-700 border border-gray-600 text-white px-4 py-3 rounded-lg focus:outline-none focus:border-blue-500"
                           placeholder="Tu contraseña" required>
                </div>
            </div>
            
            <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg font-bold mt-6 transition-colors">
                Entrar al Sistema
            </button>
        </form>
        
        <div class="mt-6 text-center">
            <p class="text-gray-400">
                ¿No tienes cuenta? 
                <a href="{% url 'registro' %}" class="text-blue-400 hover:text-blue-300 font-semibold">
                    Regístrate aquí
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
